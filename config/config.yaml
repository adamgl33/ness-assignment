test:
  name: "Circuit current test"

testing:
  sampling:
    measurements_count: 5
    total_duration_seconds: 5
    sampling_frequency_hz: null

ammeters:
  greenlee:
    port: 5001
    command: "MEASURE_GREENLEE -get_measurement"
    device_id: "greenlee device 123"
  entes:
    port: 5002
    command: "MEASURE_ENTES -get_data"
    device_id: "entes device 456"
  circutor:
    port: 5003
    command: "MEASURE_CIRCUTOR -get_measurement -current"
    device_id: "circutor device 789"

analysis:
  statistical_metrics:
  visualization:
    enabled: true
    plot_types:

logger:
  level: "DEBUG"
  directory: "../results/logs"
  name: "default_logger"

result_management:
  directory: "../results/reports"
  file_name: "report"
